server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    autoindex off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/geo+json image/svg+xml;

    # Coolify / load-balancer probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /2019/ -> /2019/2019-bier-reisen.html (each year is a single dossier)
    location ~ ^/(2019|2020|2021|2024|2026|2027)/$ {
        return 301 /$1/$1-bier-reisen.html;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    # MIME types nginx's stock mime.types does not know
    location ~* \.geojson$ {
        default_type application/geo+json;
        expires 7d;
        access_log off;
    }

    location ~* \.md$ {
        default_type text/markdown;
        expires -1;
    }

    # Posters, maps, thumbnails: safe to cache hard
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
        expires 7d;
        access_log off;
    }

    location ~* \.(?:css|js|json)$ {
        expires 1h;
    }

    # Pages themselves always revalidate so a merge is visible immediately
    location ~* \.html$ {
        expires -1;
    }
}
