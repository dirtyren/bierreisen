server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/geo+json image/svg+xml;

    # Coolify / load-balancer probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # MIME types nginx's stock mime.types does not know
    location ~* \.geojson$ {
        default_type application/geo+json;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "no-cache";
    }

    # Posters, maps, thumbnails: safe to cache hard
    location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~* \.(?:css|js|json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Pages themselves always revalidate so a merge is visible immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
