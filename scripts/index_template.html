<style>
:root{
  --bg:#0b0c15; --bg-raise:#101224; --rule:#262c48; --rule-soft:rgba(38,44,72,.62);
  --gold:#e6a817; --text:#eef1f6; --muted:#a8b2c6; --dim:#8d97ad;
  --serif:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --measure:66ch;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;caret-color:var(--gold);scrollbar-color:#3a4166 var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--gold);color:#0b0c15}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2f365a;border:3px solid var(--bg);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3f4874}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:.06em}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-9999px;top:0;background:var(--gold);color:#0b0c15;padding:.7rem 1.1rem;
  z-index:100;font-weight:700;text-decoration:none}
.skip:focus{left:0}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  .entry,.shelf-item{opacity:1!important;transform:none!important}
}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:min(72vh,640px);display:flex;align-items:center}
.hero-art{position:absolute;inset:0;z-index:-2}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:22% 42%;
  filter:saturate(.45) brightness(.3);transform:scale(1.14)}
.hero-art::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(rgba(11,12,21,.42), rgba(11,12,21,.42)),
    radial-gradient(115% 95% at 14% 55%, rgba(11,12,21,.55) 0%, rgba(11,12,21,.94) 58%, var(--bg) 100%),
    linear-gradient(180deg, rgba(11,12,21,.6) 0%, rgba(11,12,21,.25) 34%, rgba(11,12,21,1) 100%)}
.hero-inner{width:100%;max-width:1180px;margin:0 auto;
  padding:clamp(2.75rem,7vh,5.5rem) 1.6rem clamp(2rem,5.5vh,4rem)}
.hero h1{
  font-family:var(--serif);font-weight:600;letter-spacing:-.021em;line-height:1.02;
  font-size:clamp(2.5rem,6.2vw,5rem);margin:0 0 1.1rem;max-width:19ch;text-wrap:balance;
}
.hero h1 .next{display:block;color:var(--gold)}
.standfirst{max-width:56ch;color:#cfd6e4;font-size:clamp(1rem,1.5vw,1.15rem);margin:0 0 2rem}
.standfirst b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.hero-cta{display:inline-flex;align-items:center;gap:.6rem;background:var(--gold);color:#0b0c15;
  font-weight:700;text-decoration:none;padding:.85rem 1.5rem;border-radius:2px;font-size:.95rem;
  letter-spacing:.01em;transition:background .18s ease,transform .18s ease}
.hero-cta:hover{background:#f2b62a;transform:translateY(-1px)}
.hero-ghost{display:inline-flex;align-items:center;gap:.45rem;margin-left:1.3rem;color:var(--muted);
  text-decoration:none;font-size:.93rem;border-bottom:1px dotted var(--rule);padding-bottom:.15rem}
.hero-ghost:hover{color:var(--text);border-bottom-color:var(--gold)}
.hero-cta span{transition:transform .18s ease}
.hero-cta:hover span{transform:translateX(3px)}

/* controls */
.controls{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--rule-soft)}
.controls-in{max-width:1180px;margin:0 auto;padding:.8rem 1.6rem;display:flex;gap:.75rem;
  align-items:center;flex-wrap:wrap}
.search{flex:1 1 220px;max-width:330px;display:flex;align-items:center;gap:.55rem;
  border-bottom:1px solid var(--rule);padding:.35rem 0}
.search:focus-within{border-bottom-color:var(--gold)}
.search svg{flex:none;opacity:.7}
.search input{flex:1;background:none;border:0;color:var(--text);font:inherit;font-size:.95rem;padding:.25rem 0}
.search input::placeholder{color:var(--dim);opacity:1}
.search input:focus{outline:none}
.filters{display:flex;gap:.15rem;flex-wrap:wrap}
.chip{background:none;border:0;color:var(--muted);font:inherit;font-size:.86rem;font-weight:600;
  padding:.42rem .62rem;border-radius:2px;cursor:pointer;position:relative;transition:color .16s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--gold)}
.chip[aria-pressed="true"]::after{content:"";position:absolute;left:.62rem;right:.62rem;bottom:.18rem;
  height:2px;background:var(--gold)}
.tally{margin-left:auto;color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.langs{display:flex;gap:.1rem;align-items:center}
.langs a{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--dim);text-decoration:none;
  padding:.3rem .45rem;border-radius:2px}
.langs a:hover{color:var(--text)}
.langs a[aria-current="page"]{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}

/* archive */
main{max-width:1180px;margin:0 auto;padding:0 1.6rem 5rem}
section[id]{scroll-margin-top:72px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  flex-wrap:wrap;padding:3.4rem 0 .4rem;border-bottom:1px solid var(--rule)}
.section-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.4rem,2.4vw,1.95rem);
  margin:0;letter-spacing:-.012em}
.section-head p{margin:0;color:var(--dim);font-size:.88rem}

.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:300px minmax(0,1fr);gap:2.2rem;align-items:start;
  padding:2.4rem 0;border-bottom:1px solid var(--rule-soft);
  opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,1,.3,1),
    transform .6s cubic-bezier(.16,1,.3,1)}
.entry.in{opacity:1;transform:none}
.entry[hidden]{display:none}
.entry-poster{display:block;overflow:hidden;background:#070810;border:1px solid var(--rule-soft)}
.entry-poster img{width:100%;aspect-ratio:16/10;object-fit:cover;
  transition:transform .7s cubic-bezier(.16,1,.3,1),filter .4s ease;filter:saturate(.92) brightness(.94)}
.entry:hover .entry-poster img,.entry:focus-within .entry-poster img{transform:scale(1.035);
  filter:saturate(1.02) brightness(1)}
.entry-meta{display:flex;align-items:center;gap:.7rem;margin:0 0 .45rem;
  font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.entry-meta .yr{color:var(--gold);font-variant-numeric:tabular-nums}
.entry-meta .dot{width:3px;height:3px;background:var(--rule);border-radius:50%;display:inline-block}
.entry h3{font-family:var(--serif);font-weight:600;font-size:clamp(1.35rem,2.3vw,1.85rem);
  line-height:1.15;letter-spacing:-.012em;margin:0 0 .5rem}
.entry h3 a{text-decoration:underline;text-decoration-color:transparent;
  text-decoration-thickness:1px;transition:text-decoration-color .3s ease}
.entry h3 a:hover{text-decoration-color:var(--gold)}
.route{color:var(--muted);font-size:.92rem;margin:0 0 .7rem;max-width:var(--measure)}
.blurb{margin:0 0 .9rem;color:#c3cadb;max-width:var(--measure)}
.facts{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;margin:0;color:var(--dim);font-size:.85rem;
  font-variant-numeric:tabular-nums}
.facts b{color:var(--text);font-weight:600}
.links{display:flex;align-items:center;gap:1.4rem;margin:1rem 0 0;font-size:.88rem}
.open{color:var(--gold);font-weight:700;text-decoration:underline;
  text-decoration-color:rgba(230,168,23,.45);text-decoration-thickness:1px}
.open:hover{text-decoration-color:var(--gold)}
.quiet{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--rule)}
.quiet:hover{color:var(--text);border-bottom-color:var(--gold)}
.variants{display:flex;gap:.6rem;flex-wrap:wrap;margin:.85rem 0 0}
.variant{font-size:.8rem;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--rule)}
.variant:hover{color:var(--gold);border-bottom-color:var(--gold)}
.planned .entry-poster{border-color:rgba(230,168,23,.4)}

/* shelf */
.shelf{list-style:none;margin:0;padding:1.8rem 0 0;display:grid;gap:1.6rem;
  grid-template-columns:repeat(3,minmax(0,1fr))}
.shelf-item{opacity:0;transform:translateY(12px);transition:opacity .55s cubic-bezier(.16,1,.3,1),
  transform .55s cubic-bezier(.16,1,.3,1)}
.shelf-item.in{opacity:1;transform:none}
.shelf-item[hidden]{display:none}
.shelf-item a{display:block;text-decoration:none}
.shelf-item img{width:100%;aspect-ratio:16/10;object-fit:cover;filter:saturate(.85) brightness(.85);
  transition:filter .3s ease,transform .4s cubic-bezier(.16,1,.3,1)}
.shelf-item a:hover img{filter:saturate(1) brightness(1);transform:translateY(-2px)}
.shelf-item h3{font-family:var(--serif);font-weight:600;font-size:1.05rem;margin:.7rem 0 .2rem}
.shelf-item a:hover h3{color:var(--gold)}
.shelf-item p{margin:0;color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums}

.none{margin:3rem 0 0;padding:2.2rem;border:1px solid var(--rule-soft);color:var(--muted);
  text-align:center;font-size:.95rem}
.none[hidden]{display:none}
.none button{background:none;border:0;color:var(--gold);font:inherit;font-weight:700;
  text-decoration:underline;cursor:pointer;padding:0}

footer{border-top:1px solid var(--rule);background:var(--bg-raise)}
.foot{max-width:1180px;margin:0 auto;padding:2.4rem 1.6rem;display:flex;gap:1.6rem;
  justify-content:space-between;flex-wrap:wrap;color:var(--dim);font-size:.86rem}
.foot p{margin:0;max-width:58ch}
.foot a{color:var(--muted);border-bottom:1px dotted var(--rule)}
.foot a:hover{color:var(--gold)}

@media (max-height:760px) and (min-width:681px){
  .hero h1{font-size:clamp(2.1rem,4.6vw,3.5rem)}
  .standfirst{font-size:1rem;margin-bottom:1.5rem}
}
@media (max-width:900px){
  .entry{grid-template-columns:240px minmax(0,1fr);gap:1.6rem}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:680px){
  body{font-size:16px}
  .hero{min-height:auto}
  .hero-inner{padding:4rem 1.15rem 2.6rem}
  .controls-in{padding:.7rem 1.15rem}
  main{padding:0 1.15rem 3.5rem}
  .entry{grid-template-columns:1fr;gap:1.1rem;padding:2rem 0}
  .shelf{grid-template-columns:1fr;gap:1.4rem}
  .tally{display:none}
  .langs{margin-left:auto}
  .section-head{padding-top:2.4rem}
}
</style>
</head>
<body>
<a class="skip" href="#trips">__SKIP__</a>

<header class="hero">
  <div class="hero-art"><img src="__BASE__assets/thumbs/hero-europe.jpg" alt="" aria-hidden="true" fetchpriority="high"></div>
  <div class="hero-inner">
    <h1>__H1_A__<span class="next">__H1_B__</span></h1>
    <p class="standfirst">__STANDFIRST__</p>
    <a class="hero-cta" href="#trips">__CTA__ <span aria-hidden="true">→</span></a>
    <a class="hero-ghost" href="__BLOG_URL__">__FOOT_BLOG__ <span aria-hidden="true">→</span></a>
  </div>
</header>

<div class="controls">
  <div class="controls-in">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="__SEARCH_PH__" aria-label="__ARIA_SEARCH__" autocomplete="off">
    </label>
    <div class="filters" role="group" aria-label="__ARIA_FILTER__">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">__F_ALL__ __N_ALL__</button>
      <button class="chip" type="button" data-filter="travelled" aria-pressed="false">__F_TRAVELLED__ __N_TRAVELLED__</button>
      <button class="chip" type="button" data-filter="planned" aria-pressed="false">__F_PLANNED__ __N_PLANNED__</button>
      <button class="chip" type="button" data-filter="idea" aria-pressed="false">__F_DRAFTS__ __N_DRAFTS__</button>
      <button class="chip" type="button" data-filter="rail" aria-pressed="false">__F_RAIL__ __N_RAIL__</button>
    </div>
    <span class="tally" id="count" aria-live="polite"></span>
    <nav class="langs" aria-label="__LANG_LABEL__">__LANGS__</nav>
  </div>
</div>

<main>
  <section id="trips" aria-labelledby="trips-h">
    <div class="section-head">
      <h2 id="trips-h">__H_TRIPS__</h2>
      <p>__N_TRIPS__</p>
    </div>
    <ul class="entries">__ENTRIES__
    </ul>
  </section>

  <section id="ideas" aria-labelledby="ideas-h">
    <div class="section-head">
      <h2 id="ideas-h">__H_IDEAS__</h2>
      <p>__N_IDEAS__</p>
    </div>
    <ul class="shelf">__SHELF__
    </ul>
  </section>

  <p class="none" id="empty" hidden>__EMPTY_A__
    <button type="button" id="reset">__EMPTY_B__</button>.</p>
</main>

<footer>
  <div class="foot">
    <p><strong style="color:var(--text)">Bier Reisen</strong>. __FOOT_A__</p>
    <p><a href="__BLOG_URL__">__FOOT_BLOG__</a> ·
      <a href="__BASE__README.md">__FOOT_HOW__</a> ·
      <a href="__BASE__2027/data/route-2027.json">__FOOT_DATA__</a> ·
      <a href="__BASE__assets/maps/europe.png">__FOOT_POSTERS__</a></p>
  </div>
</footer>

<script>
(function () {
  var langLinks = document.querySelectorAll('.langs a');
  for (var i = 0; i < langLinks.length; i++) {
    langLinks[i].addEventListener('click', function () {
      try { localStorage.setItem('bierreisen:lang', this.getAttribute('hreflang')); } catch (e) {}
    });
  }
__LANG_BOOT__

  var COUNT = __JS_COUNT__;
  var entries = Array.prototype.slice.call(document.querySelectorAll('.entry, .shelf-item'));
  var chips = Array.prototype.slice.call(document.querySelectorAll('.chip[data-filter]'));
  var input = document.getElementById('q');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var resetEl = document.getElementById('reset');
  var filter = 'all';

  function fold(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function apply() {
    var term = fold(input.value.trim());
    var shown = 0;
    entries.forEach(function (el) {
      var tags = (el.dataset.tags || '').split(' ');
      var kindOk = filter === 'all' || tags.indexOf(filter) !== -1;
      var textOk = !term || fold(el.dataset.search).indexOf(term) !== -1;
      var show = kindOk && textOk;
      el.hidden = !show;
      if (show) shown++;
    });
    Array.prototype.forEach.call(document.querySelectorAll('main section'), function (section) {
      var any = Array.prototype.some.call(section.querySelectorAll('.entry, .shelf-item'),
        function (el) { return !el.hidden; });
      section.hidden = !any;
    });
    countEl.textContent = COUNT.replace('{n}', shown).replace('{total}', entries.length);
    emptyEl.hidden = shown !== 0;
  }

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      filter = chip.dataset.filter;
      chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c === chip)); });
      apply();
    });
  });

  input.addEventListener('input', apply);
  resetEl.addEventListener('click', function () {
    input.value = '';
    filter = 'all';
    chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.filter === 'all')); });
    apply();
    input.focus();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
    if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; apply(); input.blur(); }
  });

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (rows) {
      rows.forEach(function (row) {
        if (!row.isIntersecting) return;
        var el = row.target;
        var sibs = Array.prototype.slice.call(el.parentNode.children);
        var i = Math.min(sibs.indexOf(el), 4);
        setTimeout(function () { el.classList.add('in'); }, i * 70);
        io.unobserve(el);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.1 });
    entries.forEach(function (el) { io.observe(el); });
  } else {
    entries.forEach(function (el) { el.classList.add('in'); });
  }

  apply();
})();
</script>
