<style>
:root {
  --gold: #D4A017;
  --dark: #1a1a2e;
  --darker: #0f0f1a;
  --card: #16213e;
  --card-hover: #1a2a4a;
  --amber: #f0a500;
  --copper: #c87533;
  --cream: #f5e6ca;
  --text: #e8e8e8;
  --muted: #a0a0b0;
  --accent: #e94560;
  --green: #4ecca3;
  --blue: #3498db;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--darker);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, var(--dark) 0%, #2d1810 100%);
  padding: 2rem;
  text-align: center;
  border-bottom: 3px solid var(--gold);
}

header h1 {
  font-size: 2.5rem;
  background: linear-gradient(90deg, var(--gold), var(--amber), var(--copper));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}

.subtitle { color: var(--muted); font-size: 1.1rem; }

.tabs {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 1rem;
  background: var(--dark);
  flex-wrap: wrap;
}

.tab {
  padding: 0.75rem 1.5rem;
  border: 2px solid var(--gold);
  background: transparent;
  color: var(--gold);
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.3s;
}

.tab:hover, .tab.active {
  background: var(--gold);
  color: var(--dark);
  font-weight: bold;
}

main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Flowchart */
.flowchart { display: flex; flex-direction: column; align-items: center; gap: 0; }

.day-node {
  background: var(--card);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 1.5rem;
  width: 100%;
  max-width: 900px;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
}

.day-node:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(212, 160, 23, 0.2);
}

.day-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.day-badge {
  background: var(--gold);
  color: var(--dark);
  font-weight: bold;
  padding: 0.4rem 0.8rem;
  border-radius: 20px;
  font-size: 0.9rem;
  white-space: nowrap;
}

.day-title { font-size: 1.3rem; color: var(--amber); }
.day-region { color: var(--muted); font-size: 0.9rem; margin-left: auto; }

.stops {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 0.75rem;
}

.stop {
  background: var(--darker);
  border-radius: 8px;
  padding: 0.75rem;
  border-left: 3px solid var(--copper);
}

.stop.hidden-gem { border-left-color: var(--green); }
.stop.classic { border-left-color: var(--gold); }
.stop.pub { border-left-color: var(--accent); }

.stop-name { font-weight: bold; color: var(--cream); font-size: 0.95rem; }
.stop-type { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.stop-note { font-size: 0.85rem; color: var(--muted); margin-top: 0.3rem; }

.connector {
  width: 3px;
  height: 40px;
  background: linear-gradient(to bottom, var(--gold), var(--copper));
  position: relative;
}

.connector::after {
  content: '▼';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--copper);
  font-size: 0.8rem;
}

/* Brewery/Pub Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 1.5rem;
}

.brewery-card {
  background: var(--card);
  border-radius: 12px;
  padding: 1.5rem;
  border: 1px solid #2a2a4a;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.brewery-card:hover {
  border-color: var(--gold);
  box-shadow: 0 4px 20px rgba(212, 160, 23, 0.15);
}

.brewery-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--amber));
}

.brewery-card.hidden-gem::before {
  background: linear-gradient(90deg, var(--green), #2ecc71);
}

.brewery-card.pub::before {
  background: linear-gradient(90deg, var(--accent), #ff6b6b);
}

.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
.card-name { font-size: 1.2rem; color: var(--cream); font-weight: bold; }
.card-badge { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 12px; text-transform: uppercase; letter-spacing: 1px; }
.badge-classic { background: rgba(212, 160, 23, 0.2); color: var(--gold); border: 1px solid var(--gold); }
.badge-hidden { background: rgba(78, 204, 163, 0.2); color: var(--green); border: 1px solid var(--green); }
.badge-pub { background: rgba(233, 69, 96, 0.2); color: var(--accent); border: 1px solid var(--accent); }

.card-location { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
.card-desc { font-size: 0.9rem; line-height: 1.5; margin-bottom: 0.75rem; }

.rating {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}

.rating-stars { color: var(--gold); font-size: 1.1rem; }
.rating-num { color: var(--amber); font-weight: bold; }

.card-beers { margin-top: 0.75rem; }
.card-beers h4 { color: var(--amber); font-size: 0.85rem; margin-bottom: 0.4rem; }
.beer-tag {
  display: inline-block;
  background: rgba(240, 165, 0, 0.1);
  border: 1px solid rgba(240, 165, 0, 0.3);
  border-radius: 4px;
  padding: 0.2rem 0.5rem;
  font-size: 0.8rem;
  margin: 0.2rem;
  color: var(--cream);
}

/* Beer List Table */
.beer-table-wrapper { overflow-x: auto; }

.beer-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.beer-table th {
  background: var(--card);
  color: var(--gold);
  padding: 0.75rem;
  text-align: left;
  border-bottom: 2px solid var(--gold);
  position: sticky;
  top: 0;
}

.beer-table td {
  padding: 0.6rem 0.75rem;
  border-bottom: 1px solid #2a2a4a;
}

.beer-table tr:hover { background: var(--card); }

.color-swatch {
  display: inline-block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 0.5rem;
  border: 1px solid rgba(255,255,255,0.2);
}

.filter-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  align-items: center;
}

.filter-bar input, .filter-bar select {
  background: var(--card);
  border: 1px solid #2a2a4a;
  color: var(--text);
  padding: 0.5rem 1rem;
  border-radius: 6px;
  font-size: 0.9rem;
}

.filter-bar input:focus, .filter-bar select:focus {
  border-color: var(--gold);
  outline: none;
}

/* Map */
#mapContainer { height: 700px; border-radius: 12px; overflow: hidden; }

.map-popup h3 { color: #333; margin-bottom: 0.3rem; }
.map-popup p { color: #555; font-size: 0.85rem; }
.map-popup .popup-rating { color: #D4A017; font-weight: bold; }

/* Responsive */
@media (max-width: 768px) {
  header h1 { font-size: 1.8rem; }
  .tabs { gap: 0.3rem; }
  .tab { padding: 0.5rem 0.8rem; font-size: 0.85rem; }
  .stops { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  #mapContainer { height: 450px; }
}
</style>

// === TAB NAVIGATION ===
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'map' && !window.mapInitialized) initMap();
  });
});

// === FLOWCHART RENDERING ===
function renderFlowchart() {
  const container = document.getElementById('flowchart');
  let html = '<div class="flowchart">';

  TRIP_DAYS.forEach((day, i) => {
    html += `
      <div class="day-node">
        <div class="day-header">
          <span class="day-badge">Day ${day.day}</span>
          <span class="day-title">${day.title}</span>
          <span class="day-region">📍 ${day.region}</span>
        </div>
        <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem;">
          🚗 ${day.transport} | 🏨 ${day.overnight}
        </div>
        <div class="stops">
          ${day.stops.map(s => `
            <div class="stop ${s.type}">
              <div class="stop-type">${s.type === 'classic' ? '⭐ Classic' : s.type === 'hidden-gem' ? '💎 Hidden Gem' : '🍺 Pub'}</div>
              <div class="stop-name">${s.name}</div>
              <div class="stop-note">${s.note}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    if (i < TRIP_DAYS.length - 1) {
      html += '<div class="connector"></div>';
    }
  });

  html += '</div>';

  // Add trip tips
  html += `
    <div style="margin-top:2rem;padding:1.5rem;background:var(--card);border-radius:12px;border:1px solid var(--gold);">
      <h3 style="color:var(--gold);margin-bottom:1rem;">🧭 Pro Tips for This Trip</h3>
      <ul style="color:var(--text);line-height:2;padding-left:1.2rem;">
        <li><strong>Car rental:</strong> Pick up in Brussels Day 2, drop off in Pilsen Day 9. Essential for Hainaut & Ardennes.</li>
        <li><strong>Best day for Vapeur:</strong> Plan Day 3 around the last Saturday of the month for the steam brewery.</li>
        <li><strong>Westvleteren tip:</strong> Arrive early at In de Vrede. The 12 sometimes sells out by afternoon.</li>
        <li><strong>Fantôme warning:</strong> Call +32 86 47 70 44 before driving to Soy. Dany opens when he feels like it.</li>
        <li><strong>Bruges strategy:</strong> Do breweries Day 4 afternoon, pubs Day 5 (walking day). De Garre fills up - go at opening.</li>
        <li><strong>Designated driver:</strong> Belgian beers are STRONG. Many stops offer small pours. Pace yourself (or hire a guide).</li>
        <li><strong>Cantillon:</strong> Closed Sundays and most of August. Book online to guarantee entry.</li>
        <li><strong>Kulminator:</strong> Ask Dirk for a vertical tasting of aged Chimay Blue. Mind-blowing comparison.</li>
        <li><strong>Budget tip:</strong> Many Belgian breweries charge €5-15 for tours with tastings. Pubs are where you'll spend more.</li>
        <li><strong>Season:</strong> Spring (Apr-May) or Autumn (Sep-Oct) ideal. Summer is tourist-heavy in Bruges.</li>
      </ul>
    </div>
  `;

  container.innerHTML = html;
}

// === MAP ===
function initMap() {
  window.mapInitialized = true;
  const map = L.map('mapContainer').setView([50.5, 4.5], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 18
  }).addTo(map);

  // Route line
  const routePoints = [
    [50.1109, 8.6821],  // Frankfurt
    [50.8467, 4.3525],  // Brussels
    [50.7676, 4.2912],  // Beersel/Pajottenland
    [50.5519, 3.6453],  // Hainaut
    [50.9440, 3.1291],  // Roeselare
    [50.8444, 3.2270],  // Bruges
    [50.8895, 2.7218],  // Westvleteren
    [51.2165, 4.4128],  // Antwerp
    [49.6345, 5.3468],  // Orval
    [50.0434, 4.3181],  // Chimay
    [50.9420, 6.9535],  // Cologne
    [49.7490, 13.3876]  // Pilsen
  ];

  L.polyline(routePoints, {
    color: '#D4A017',
    weight: 3,
    opacity: 0.7,
    dashArray: '10, 8'
  }).addTo(map);

  // Day markers on route
  const dayLabels = ['Frankfurt (Start)', 'Day 1-2: Brussels', '', 'Day 3: Hainaut', 'Day 4: West Flanders', 'Day 5: Bruges', 'Day 6: Westvleteren', 'Day 6: Antwerp', 'Day 7: Ardennes', 'Day 8: Chimay', 'Day 8: Cologne', 'Day 9: Pilsen (End)'];

  routePoints.forEach((point, i) => {
    if (dayLabels[i]) {
      L.circleMarker(point, {
        radius: 8,
        color: '#D4A017',
        fillColor: '#1a1a2e',
        fillOpacity: 1,
        weight: 2
      }).addTo(map).bindPopup(`<strong>${dayLabels[i]}</strong>`);
    }
  });

  // Markers for all places
  const icons = {
    'classic': { color: '#D4A017', emoji: '⭐' },
    'hidden-gem': { color: '#4ecca3', emoji: '💎' },
    'pub': { color: '#e94560', emoji: '🍺' }
  };

  PLACES.forEach(place => {
    const iconConfig = icons[place.type];
    const marker = L.circleMarker([place.lat, place.lng], {
      radius: 7,
      color: iconConfig.color,
      fillColor: iconConfig.color,
      fillOpacity: 0.8,
      weight: 1
    }).addTo(map);

    marker.bindPopup(`
      <div class="map-popup">
        <h3>${iconConfig.emoji} ${place.name}</h3>
        <p><strong>${place.city}, ${place.country}</strong></p>
        <p>${place.desc}</p>
        <p class="popup-rating">★ ${place.rating}/10 | Day ${place.day}</p>
        ${place.tours ? `<p><em>🎫 ${place.tours}</em></p>` : ''}
      </div>
    `, { maxWidth: 300 });
  });

  // Legend
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.style.cssText = 'background:rgba(26,26,46,0.9);padding:10px 14px;border-radius:8px;border:1px solid #D4A017;color:#e8e8e8;font-size:13px;';
    div.innerHTML = `
      <strong style="color:#D4A017">Legend</strong><br>
      <span style="color:#D4A017">●</span> Classic Brewery<br>
      <span style="color:#4ecca3">●</span> Hidden Gem<br>
      <span style="color:#e94560">●</span> Pub / Café<br>
      <span style="color:#D4A017">---</span> Route
    `;
    return div;
  };
  legend.addTo(map);
}

// === BREWERIES & PUBS LIST ===
function renderBreweries() {
  const container = document.getElementById('breweries');

  // Sort by rating descending
  const sorted = [...PLACES].sort((a, b) => b.rating - a.rating);

  let html = `
    <div class="filter-bar">
      <input type="text" id="placeSearch" placeholder="🔍 Search breweries & pubs..." oninput="filterPlaces()">
      <select id="typeFilter" onchange="filterPlaces()">
        <option value="all">All Types</option>
        <option value="classic">⭐ Classic Breweries</option>
        <option value="hidden-gem">💎 Hidden Gems</option>
        <option value="pub">🍺 Pubs & Cafés</option>
      </select>
      <select id="dayFilter" onchange="filterPlaces()">
        <option value="all">All Days</option>
        ${[1,2,3,4,5,6,7,8,9].map(d => `<option value="${d}">Day ${d}</option>`).join('')}
      </select>
      <span style="color:var(--muted);font-size:0.85rem;" id="placeCount">${sorted.length} places</span>
    </div>
    <div class="cards-grid" id="cardsGrid">
  `;

  sorted.forEach((place, idx) => {
    const badge = place.type === 'classic' ? 'badge-classic' : place.type === 'hidden-gem' ? 'badge-hidden' : 'badge-pub';
    const badgeLabel = place.type === 'classic' ? 'CLASSIC' : place.type === 'hidden-gem' ? 'HIDDEN GEM' : 'PUB';
    const stars = '★'.repeat(Math.round(place.rating / 2)) + '☆'.repeat(5 - Math.round(place.rating / 2));

    html += `
      <div class="brewery-card ${place.type}" data-type="${place.type}" data-day="${place.day}" data-name="${place.name.toLowerCase()}">
        <div class="card-header">
          <span class="card-name">#${idx + 1} ${place.name}</span>
          <span class="card-badge ${badge}">${badgeLabel}</span>
        </div>
        <div class="card-location">📍 ${place.city}, ${place.country} | 📅 Day ${place.day}</div>
        <div class="rating">
          <span class="rating-stars">${stars}</span>
          <span class="rating-num">${place.rating}/10</span>
        </div>
        <div class="card-desc">${place.desc}</div>
        ${place.tours ? `<div style="font-size:0.8rem;color:var(--green);margin-top:0.5rem;">🎫 ${place.tours}</div>` : ''}
        <div class="card-beers">
          <h4>Must-Try:</h4>
          ${place.beers.map(b => `<span class="beer-tag">${b}</span>`).join('')}
        </div>
      </div>
    `;
  });

  html += '</div>';
  container.innerHTML = html;
}

function filterPlaces() {
  const search = document.getElementById('placeSearch').value.toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const day = document.getElementById('dayFilter').value;
  const cards = document.querySelectorAll('.brewery-card');
  let count = 0;

  cards.forEach(card => {
    const matchSearch = card.dataset.name.includes(search) || card.textContent.toLowerCase().includes(search);
    const matchType = type === 'all' || card.dataset.type === type;
    const matchDay = day === 'all' || card.dataset.day === day;
    const show = matchSearch && matchType && matchDay;
    card.style.display = show ? '' : 'none';
    if (show) count++;
  });

  document.getElementById('placeCount').textContent = `${count} places`;
}

// === BEER LIST TABLE ===
function renderBeers() {
  const container = document.getElementById('beers');

  let html = `
    <div class="filter-bar">
      <input type="text" id="beerSearch" placeholder="🔍 Search beers, styles, breweries..." oninput="filterBeers()">
      <select id="styleFilter" onchange="filterBeers()">
        <option value="all">All Styles</option>
        ${[...new Set(BEERS.map(b => b.style))].sort().map(s => `<option value="${s}">${s}</option>`).join('')}
      </select>
      <select id="abvFilter" onchange="filterBeers()">
        <option value="all">All ABV</option>
        <option value="session">Session (< 5%)</option>
        <option value="standard">Standard (5-7%)</option>
        <option value="strong">Strong (7-9%)</option>
        <option value="very-strong">Very Strong (9%+)</option>
      </select>
      <span style="color:var(--muted);font-size:0.85rem;" id="beerCount">${BEERS.length} beers</span>
    </div>
    <div class="beer-table-wrapper">
      <table class="beer-table" id="beerTable">
        <thead>
          <tr>
            <th>Color</th>
            <th>Beer Name</th>
            <th>Brewery</th>
            <th>Style</th>
            <th>ABV</th>
            <th>IBU</th>
            <th>Availability</th>
            <th>Tasting Notes</th>
          </tr>
        </thead>
        <tbody>
  `;

  BEERS.forEach(beer => {
    html += `
      <tr data-style="${beer.style}" data-abv="${beer.abv}" data-search="${(beer.name + ' ' + beer.brewery + ' ' + beer.style + ' ' + beer.notes).toLowerCase()}">
        <td><span class="color-swatch" style="background:${beer.color}" title="${beer.colorName}"></span>${beer.colorName}</td>
        <td><strong>${beer.name}</strong></td>
        <td>${beer.brewery}</td>
        <td>${beer.style}</td>
        <td><strong>${beer.abv}%</strong></td>
        <td>${beer.ibu || '—'}</td>
        <td><em>${beer.availability}</em></td>
        <td>${beer.notes}</td>
      </tr>
    `;
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function filterBeers() {
  const search = document.getElementById('beerSearch').value.toLowerCase();
  const style = document.getElementById('styleFilter').value;
  const abvRange = document.getElementById('abvFilter').value;
  const rows = document.querySelectorAll('#beerTable tbody tr');
  let count = 0;

  rows.forEach(row => {
    const matchSearch = row.dataset.search.includes(search);
    const matchStyle = style === 'all' || row.dataset.style === style;
    const abv = parseFloat(row.dataset.abv);
    let matchAbv = true;
    if (abvRange === 'session') matchAbv = abv < 5;
    else if (abvRange === 'standard') matchAbv = abv >= 5 && abv < 7;
    else if (abvRange === 'strong') matchAbv = abv >= 7 && abv < 9;
    else if (abvRange === 'very-strong') matchAbv = abv >= 9;

    const show = matchSearch && matchStyle && matchAbv;
    row.style.display = show ? '' : 'none';
    if (show) count++;
  });

  document.getElementById('beerCount').textContent = `${count} beers`;
}
